name: Template validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            installer: bash
          - os: ubuntu-latest
            installer: powershell
          - os: windows-latest
            installer: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check local installer on Linux
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./scripts/test-installers.ps1 -Installer ${{ matrix.installer }}
      - name: Check local installer on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installers.ps1 -Installer powershell

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check Docker
        run: docker info
      - name: Restore
        run: dotnet restore Ceataec.ExampleService.sln
      - name: Build
        run: dotnet build Ceataec.ExampleService.sln --no-restore -warnaserror:MSB3277
      - name: Test
        run: dotnet test Ceataec.ExampleService.sln --no-build
